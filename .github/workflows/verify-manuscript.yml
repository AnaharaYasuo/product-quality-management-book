name: Verify Manuscript and Quality Gate

on:
  push:
    branches: [main, feat/*, fix/*]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-analysis:
    name: Markdown & Text Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # 本文のスニペット（19.3/12.5/22.5）は origin/main との差分を取れないと fail-closed で止まる。
          # スモーク実行で本文どおりに動かすため、履歴ごと取得する
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install Markdownlint, Textlint & Python Dependencies
        run: |
          npm install -g markdownlint-cli textlint textlint-rule-preset-ja-technical-writing textlint-rule-prh
          python -m pip install --upgrade pip
          pip install pyyaml playwright ruff pytest pydantic hypothesis jsonschema
          playwright install chromium

      - name: Run Markdownlint
        run: |
          markdownlint "manuscript/*.md" --config ".markdownlint.yaml" --ignore "manuscript/style.css"

      - name: Run All Deterministic Quality Gates (Linter, Terminology, Embedded Code AST, DoD, Mermaid SVG, RAG & Ruff)
        run: |
          python tools/run_all_gates.py

      - name: Verify Process Gate (PR Issue Traceability)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python -c '
          import os, re, sys
          text = (os.environ.get("PR_TITLE", "") + "\n" + os.environ.get("PR_BODY", ""))
          if not re.search(r"(#\d+|Closes\s+#\d+|Ref\s+#\d+)", text, re.IGNORECASE):
              print("FAILED: [Process-Gate] PRにGitHub Issue番号（例: Closes #123 または #123）が紐付けられていません。")
              sys.exit(1)
          print("PASSED: PR Issue traceability verified.")
          '

  link-check:
    name: Dead Link Checker (Lychee DAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Lychee Link Checker
        uses: lycheeverse/lychee-action@2b973e86fc7b1f6b36a93795fe2c9c6ae1118621 # v1.10.0
        with:
          args: "--verbose --no-progress 'manuscript/**/*.md' 'README.md'"
          fail: true

  epub-validation:
    name: EPUB Build and EPUBCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Pandoc & Download EPUBCheck (from GitHub Releases without apt dependency)
        run: |
          wget -q https://github.com/jgm/pandoc/releases/download/3.1.11.1/pandoc-3.1.11.1-linux-amd64.tar.gz
          sudo tar xvzf pandoc-3.1.11.1-linux-amd64.tar.gz --strip-components 1 -C /usr/local
          wget -q https://github.com/w3c/epubcheck/releases/download/v5.1.0/epubcheck-5.1.0.zip
          unzip -q epubcheck-5.1.0.zip

      - name: Build EPUB with Pandoc
        run: |
          pandoc -o test-build.epub manuscript/metadata.yaml $(ls manuscript/*.md | sort) --toc --toc-depth=2 --lua-filter=tools/pandoc/parts.lua --css=manuscript/style.css

      - name: Run EPUBCheck (W3C Validator)
        run: |
          java -jar epubcheck-5.1.0/epubcheck.jar test-build.epub
