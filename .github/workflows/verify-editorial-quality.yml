name: Editorial Review & Human Experience Quality Gate

on:
  workflow_dispatch:
    inputs:
      review_all:
        description: '全章レビューを実行するか (true: 全章, false: 差分のみ)'
        required: false
        default: 'false'
        type: boolean
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'manuscript/**'
      - 'tools/evaluate_chapter_editorial.py'
      - '.github/workflows/verify-editorial-quality.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  editorial-review:
    name: LLM-as-a-Judge Editorial & UX Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai google-generativeai

      - name: Run Editorial Review Quality Gate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ inputs.review_all }}" = "true" ]; then
            python tools/evaluate_chapter_editorial.py --all --report-out editorial_review_report.md --json-out editorial_review_result.json
          else
            python tools/evaluate_chapter_editorial.py --report-out editorial_review_report.md --json-out editorial_review_result.json
          fi

      - name: Comment PR with Review Report
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const reportPath = 'editorial_review_report.md';
            if (fs.existsSync(reportPath)) {
              const reportContent = fs.readFileSync(reportPath, 'utf8');
              const body = `### 📚 商業出版・編集者AIレビュー（UX＆人間満足度判定）\n\n${reportContent}`;
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
