name: Editorial Review & Human Experience Quality Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'manuscript/**'
      - 'tools/evaluate_chapter_editorial.py'
      - '.github/workflows/verify-editorial-quality.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  editorial-review:
    name: LLM-as-a-Judge Editorial & UX Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai google-generativeai

      - name: Run Editorial Review Quality Gate (Diff only)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python tools/evaluate_chapter_editorial.py --report-out editorial_review_report.md --json-out editorial_review_result.json

      - name: Comment PR with Review Report
        if: always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const reportPath = 'editorial_review_report.md';
            if (fs.existsSync(reportPath)) {
              const reportContent = fs.readFileSync(reportPath, 'utf8');
              const body = `### 📚 商業出版・編集者AIレビュー（UX＆人間満足度判定）\n\n${reportContent}`;
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }
