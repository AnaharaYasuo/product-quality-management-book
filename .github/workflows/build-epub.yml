name: Build EPUB

on:
  push:
    branches: [ "main", "production" ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install Pandoc, Japanese Fonts & Playwright (Resilient Direct Install)
        run: |
          wget -q https://github.com/jgm/pandoc/releases/download/3.1.11.1/pandoc-3.1.11.1-linux-amd64.tar.gz
          sudo tar xvzf pandoc-3.1.11.1-linux-amd64.tar.gz --strip-components 1 -C /usr/local
          mkdir -p ~/.local/share/fonts
          wget -q -O ~/.local/share/fonts/NotoSansCJKjp-Regular.otf https://github.com/notofonts/noto-cjk/raw/main/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf
          wget -q -O ~/.local/share/fonts/NotoSansCJKjp-Bold.otf https://github.com/notofonts/noto-cjk/raw/main/Sans/OTF/Japanese/NotoSansCJKjp-Bold.otf
          fc-cache -fv
          python -m pip install --upgrade pip
          pip install markdown pygments pyyaml playwright
          playwright install chromium

      - name: Determine Output Filenames
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            echo "epub_filename=product-quality-management-${TAG_NAME}.epub" >> "$GITHUB_OUTPUT"
            echo "pdf_filename=product-quality-management-${TAG_NAME}.pdf" >> "$GITHUB_OUTPUT"
            echo "html_filename=product-quality-management-${TAG_NAME}.html" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "epub_filename=product-quality-management.epub" >> "$GITHUB_OUTPUT"
            echo "pdf_filename=product-quality-management.pdf" >> "$GITHUB_OUTPUT"
            echo "html_filename=product-quality-management.html" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build EPUB
        run: |
          mkdir -p output
          pandoc \
            manuscript/metadata.yaml \
            $(ls manuscript/*.md | sort) \
            -o "output/${{ steps.meta.outputs.epub_filename }}" \
            --toc \
            --toc-depth=2 \
            --css=manuscript/style.css

      - name: Build PDF & Run E2E Smoke Verification (Mermaid SVG & 27 Chapters)
        run: |
          python tools/build_pdf.py \
            --html-out "output/${{ steps.meta.outputs.html_filename }}" \
            --pdf-out "output/${{ steps.meta.outputs.pdf_filename }}"

      - name: Generate SHA-256 Checksums (Supply Chain Provenance)
        run: |
          cd output
          sha256sum "${{ steps.meta.outputs.epub_filename }}" "${{ steps.meta.outputs.pdf_filename }}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload EPUB & PDF Artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: book-artifacts-${{ github.ref_name }}
          path: |
            output/${{ steps.meta.outputs.epub_filename }}
            output/${{ steps.meta.outputs.pdf_filename }}
            output/SHA256SUMS.txt

      - name: Create GitHub Release on Tag Push
        if: steps.meta.outputs.is_release == 'true'
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          name: Release ${{ steps.meta.outputs.tag_name }}
          tag_name: ${{ steps.meta.outputs.tag_name }}
          files: |
            output/${{ steps.meta.outputs.epub_filename }}
            output/${{ steps.meta.outputs.pdf_filename }}
            output/SHA256SUMS.txt
          generate_release_notes: true
