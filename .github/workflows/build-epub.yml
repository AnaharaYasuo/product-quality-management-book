name: Build EPUB

on:
  push:
    branches: [ "main", "production" ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Determine EPUB Filename
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            echo "filename=product-quality-management-${TAG_NAME}.epub" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "filename=product-quality-management.epub" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build EPUB
        run: |
          mkdir -p output
          pandoc \
            manuscript/metadata.yaml \
            manuscript/00_intro.md \
            manuscript/01_chapter1.md \
            manuscript/99_afterword.md \
            -o "output/${{ steps.meta.outputs.filename }}" \
            --toc \
            --toc-depth=2 \
            --css=manuscript/style.css

      - name: Upload EPUB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.filename }}
          path: output/${{ steps.meta.outputs.filename }}

      - name: Create GitHub Release on Tag Push
        if: steps.meta.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.meta.outputs.tag_name }}
          tag_name: ${{ steps.meta.outputs.tag_name }}
          files: output/${{ steps.meta.outputs.filename }}
          generate_release_notes: true
