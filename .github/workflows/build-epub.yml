name: Build EPUB

on:
  push:
    branches: [ "main", "production" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Build EPUB
        run: |
          mkdir -p output
          pandoc \
            manuscript/metadata.yaml \
            manuscript/00_intro.md \
            manuscript/01_chapter1.md \
            manuscript/99_afterword.md \
            -o output/product-quality-management.epub \
            --toc \
            --toc-depth=2 \
            --css=manuscript/style.css

      - name: Upload EPUB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name == 'production' && 'product-quality-management-release-epub' || 'product-quality-management-dev-epub' }}
          path: output/product-quality-management.epub
